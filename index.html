<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Pie Dashboard — Finance Reporting</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Interactive Pie Dashboard — Finance Reporting</h1>
    <div class="controls">
      <label for="datasetSelect" class="visually-hidden">Choose view</label>
      <select id="datasetSelect" aria-label="Select dataset view">
        <option value="all">All (default)</option>
        <option value="investment">Investment Platform</option>
        <option value="private">Private</option>
        <option value="public">Public</option>
      </select>
      <button id="resetFiltersBtn">Reset Filters</button>
      <button id="exportPdfBtn">Export to PDF</button>
    </div>
  </header>

  <main>
    <!-- Investment: top, centered -->
    <section class="panel panel-top" id="investment-panel" aria-labelledby="investment-title">
      <h2 id="investment-title" class="panel-title">Investment Platform</h2>
      <div class="chart-wrapper">
        <canvas id="chart-investment-main" class="chart-canvas" width="420" height="420" aria-label="Investment Platform breakdown"></canvas>
      </div>
      <div class="sub-info" id="investment-info">Total:</div>

      <div class="chart-wrapper small" id="investment-top-wrapper" style="display:none">
        <h3 class="sub-title">Top vs Rest</h3>
        <canvas id="chart-investment-top" class="chart-canvas" width="260" height="260" aria-label="Investment Platform top versus rest"></canvas>
      </div>

      <div id="legend-investment" class="panel-legend" aria-hidden="false"></div>
    </section>

    <!-- Row with Public and Private -->
    <div class="lower-row">
      <section class="panel" id="public-panel" aria-labelledby="public-title">
        <h2 id="public-title" class="panel-title">Public</h2>
        <div class="chart-wrapper">
          <canvas id="chart-public-main" class="chart-canvas" width="320" height="320" aria-label="Public breakdown"></canvas>
        </div>
        <div class="sub-info" id="public-info">Total:</div>

        <div class="chart-wrapper small" id="public-top-wrapper" style="display:none">
          <h3 class="sub-title">Top vs Rest</h3>
          <canvas id="chart-public-top" class="chart-canvas" width="200" height="200" aria-label="Public top versus rest"></canvas>
        </div>

        <div id="legend-public" class="panel-legend" aria-hidden="false"></div>
      </section>

      <section class="panel" id="private-panel" aria-labelledby="private-title">
        <h2 id="private-title" class="panel-title">Private</h2>
        <div class="chart-wrapper">
          <canvas id="chart-private-main" class="chart-canvas" width="320" height="320" aria-label="Private breakdown"></canvas>
        </div>
        <div class="sub-info" id="private-info">Total:</div>

        <div class="chart-wrapper small" id="private-top-wrapper" style="display:none">
          <h3 class="sub-title">Top vs Rest</h3>
          <canvas id="chart-private-top" class="chart-canvas" width="200" height="200" aria-label="Private top versus rest"></canvas>
        </div>

        <div id="legend-private" class="panel-legend" aria-hidden="false"></div>
      </section>
    </div>
  </main>

  <footer>
    <small>Interactive dashboard with Chart.js, filters, and PDF export.</small>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
